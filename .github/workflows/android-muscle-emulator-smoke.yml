name: Android muscle atlas emulator smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android container and bundled assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin automation/skeleton-assets-20260729
          git checkout FETCH_HEAD -- android-smoke/app/project
          rm -rf android-smoke/app/project/assets
          mkdir -p android-smoke/app/project/assets/model android-smoke/app/project/assets/js
          gh run download 30434735489 -n skeleton-glb-assets -D /tmp/bone
          gh run download 30453718350 -n bodyparts3d-muscle-glb -D /tmp/muscle
          gh run download 30458106484 -n three-runtime-r128 -D /tmp/three
          cp /tmp/bone/model/full_skeleton.glb android-smoke/app/project/assets/model/
          cp /tmp/muscle/full_muscles.glb android-smoke/app/project/assets/model/
          cp -a /tmp/three/js/. android-smoke/app/project/assets/js/
          grep -q "REVISION = '128'" android-smoke/app/project/assets/js/three.module.js
          python3 -m pip install --quiet trimesh
          python3 - <<'PY'
          from pathlib import Path
          import trimesh
          root=Path('android-smoke/app/project/assets/model')
          for name in ('full_skeleton.glb','full_muscles.glb'):
              path=root/name
              scene=trimesh.load(path,force='scene',process=False)
              path.write_bytes(trimesh.exchange.gltf.export_glb(scene,include_normals=True))
              print(name,path.stat().st_size)
          PY
          cat > android-smoke/app/project/assets/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#v{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d}#s{position:fixed;z-index:2;left:8px;top:8px;color:white;background:#172033dd;padding:10px;border-radius:10px;font:14px sans-serif}</style></head><body><div id="s">loading</div><div id="v"></div><script type="module">
          import * as THREE from './js/three.module.js';import{GLTFLoader}from'./js/loaders/GLTFLoader.js';
          async function main(){
            const host=document.querySelector('#v'),status=document.querySelector('#s');
            const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.set(0,0,-18);
            const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'default',preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.NoToneMapping;renderer.physicallyCorrectLights=false;host.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff,.22));scene.add(new THREE.HemisphereLight(0xffffff,0x60758a,.52));
            const key=new THREE.DirectionalLight(0xfff8eb,.72);key.position.set(-5,8,-8);scene.add(key);const fill=new THREE.DirectionalLight(0xc5e8ff,.32);fill.position.set(7,3,7);scene.add(fill);const front=new THREE.DirectionalLight(0xffffff,.20);front.position.set(0,2,-10);scene.add(front);
            const loader=new GLTFLoader();const loaded=await Promise.all([loader.loadAsync('./model/full_skeleton.glb'),loader.loadAsync('./model/full_muscles.glb')]);const bones=loaded[0],muscles=loaded[1];
            const root=new THREE.Group();root.add(bones.scene,muscles.scene);scene.add(root);const b=new Map(),m=new Map();
            bones.scene.traverse(x=>{if(x.isMesh){let n=x;while(n&&!/^(skull|sacrum|sternum|[CTL]\d+|rib-|clavicle-|scapula-|pelvis-|humerus-|radius-|ulna-|hand-|femur-|patella-|tibia-|fibula-|foot-)/.test(n.name))n=n.parent;if(n){x.material=new THREE.MeshPhongMaterial({color:0xe6d6b8,emissive:0x120d08,emissiveIntensity:.06,specular:0x8a7b68,shininess:18});b.set(n.name,x)}}});
            muscles.scene.traverse(x=>{if(x.isMesh){let n=x;while(n&&n.name.indexOf('-')<0)n=n.parent;if(n){x.material=new THREE.MeshPhongMaterial({color:0xc65358,emissive:0x170404,emissiveIntensity:.05,transparent:true,opacity:.68,depthWrite:false});m.set(n.name,x)}}});
            root.updateMatrixWorld(true);let box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3());if(size.z>size.y)root.rotation.x=-Math.PI/2;root.updateMatrixWorld(true);box=new THREE.Box3().setFromObject(root);root.scale.multiplyScalar(12.5/box.getSize(new THREE.Vector3()).y);root.updateMatrixWorld(true);box=new THREE.Box3().setFromObject(root);const c=box.getCenter(new THREE.Vector3());root.position.set(-c.x,-c.y,-c.z);
            let selection='bone',display='related';
            function apply(){b.forEach(x=>x.visible=display!=='muscles-only');m.forEach(x=>x.visible=display!=='bones-only');renderer.render(scene,camera)}
            function setDisplay(next){display=next;if(next==='bones-only')selection='bone';if(next==='muscles-only')selection='muscle';apply()}
            function countVisible(map){let n=0;map.forEach(x=>{if(x.visible)n++});return n}
            function frameStats(mode,minP95,minFraction){
              renderer.render(scene,camera);
              const gl=renderer.getContext(),w=gl.drawingBufferWidth,h=gl.drawingBufferHeight;
              const x=Math.floor(w*.15),y=Math.floor(h*.18),sw=Math.max(1,Math.floor(w*.70)),sh=Math.max(1,Math.floor(h*.64));
              const pixels=new Uint8Array(sw*sh*4);gl.readPixels(x,y,sw,sh,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
              const values=[];let bright=0;
              for(let i=0;i<pixels.length;i+=4){const l=.2126*pixels[i]+.7152*pixels[i+1]+.0722*pixels[i+2];values.push(l);if(l>=85)bright++}
              values.sort((a,b)=>a-b);const p95=values[Math.min(values.length-1,Math.floor(values.length*.95))]||0;const fraction=values.length?bright/values.length:0;const pass=p95>=minP95&&fraction>=minFraction;
              console.info(`ANDROID_FRAME_STATS mode=${mode} p95=${p95.toFixed(2)} bright=${fraction.toFixed(4)} pass=${pass} width=${w} height=${h}`);
              if(!pass)console.error(`ANDROID_ANATOMY_ERROR framebuffer-dark mode=${mode} p95=${p95.toFixed(2)} bright=${fraction.toFixed(4)}`);
              return pass;
            }
            setDisplay('bones-only');status.textContent='骨のみ';console.info(`ANDROID_BONES_ONLY selection=${selection} display=${display} bones=${countVisible(b)} muscles=${countVisible(m)} encoding=${renderer.outputEncoding} three=${THREE.REVISION}`);
            setTimeout(()=>frameStats('bones-only',120,.03),1500);
            setTimeout(()=>{setDisplay('muscles-only');status.textContent='筋肉のみ';console.info(`ANDROID_MUSCLES_ONLY selection=${selection} display=${display} bones=${countVisible(b)} muscles=${countVisible(m)}`);setTimeout(()=>frameStats('muscles-only',95,.02),1500)},20000);
            setTimeout(()=>{display='related';selection='bone';apply();const t4=b.get('T4'),trap=m.get('trapezius-left');m.forEach(x=>x.visible=false);t4.material.color.set(0xf59e0b);trap.visible=true;trap.material.color.set(0x38bdf8);trap.material.opacity=.36;renderer.render(scene,camera);status.textContent='関連表示';console.info(`ANDROID_DISPLAY_DONE selection=${selection} display=${display} related=${t4.visible&&trap.visible&&trap.material.opacity===.36}`);setTimeout(()=>frameStats('related',105,.02),1500)},40000);
            function loop(){renderer.render(scene,camera);requestAnimationFrame(loop)}loop();
          }
          main().catch(error=>{document.querySelector('#s').textContent=String(error);console.error('ANDROID_ANATOMY_ERROR '+(error&&error.stack||error));});
          </script></body></html>
          HTML
      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$PWD/android-smoke/app/project"; BUILD="$PWD/android-smoke/app/build"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          rm -rf "$BUILD";mkdir -p "$BUILD/classes" "$BUILD/dex"
          javac -encoding UTF-8 -source 8 -target 8 -bootclasspath "$ANDROID_JAR" -d "$BUILD/classes" "$PROJ/src/jp/openai/upperskeleton/MainActivity.java"
          mapfile -t C < <(find "$BUILD/classes" -name '*.class');"$BT/d8" --min-api 23 --lib "$ANDROID_JAR" --output "$BUILD/dex" "${C[@]}"
          "$BT/aapt2" compile --dir "$PROJ/res" -o "$BUILD/resources.zip"
          "$BT/aapt2" link -I "$ANDROID_JAR" --manifest "$PROJ/AndroidManifest.xml" -A "$PROJ/assets" -o "$BUILD/unsigned.apk" "$BUILD/resources.zip"
          (cd "$BUILD/dex"&&zip -q -j "$BUILD/unsigned.apk" classes.dex)
          keytool -genkeypair -noprompt -keystore "$BUILD/key.jks" -storepass android -keypass android -alias key -dname 'CN=Smoke' -keyalg RSA -keysize 2048 -validity 1000
          "$BT/zipalign" -f 4 "$BUILD/unsigned.apk" "$BUILD/aligned.apk";"$BT/apksigner" sign --ks "$BUILD/key.jks" --ks-pass pass:android --key-pass pass:android --out "$BUILD/app.apk" "$BUILD/aligned.apk"
          echo "APK=$BUILD/app.apk" >> "$GITHUB_ENV"
      - name: Run on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh android-smoke/run-display-mode-smoke.sh
      - name: Check emulator framebuffer brightness
        shell: bash
        run: |
          set -euo pipefail
          grep -E 'ANDROID_FRAME_STATS mode=bones-only .*pass=true' android-smoke/results/webview.txt
          grep -E 'ANDROID_FRAME_STATS mode=muscles-only .*pass=true' android-smoke/results/webview.txt
          grep -E 'ANDROID_FRAME_STATS mode=related .*pass=true' android-smoke/results/webview.txt
          ! grep -q 'ANDROID_ANATOMY_ERROR' android-smoke/results/webview.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-display-mode-final-evidence
          path: android-smoke/results
          if-no-files-found: warn
