name: Build temporary Model Color APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-model-color-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out temporary build branch
        uses: actions/checkout@v4

      - name: Verify temporary source chunks
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/restore.log
          {
            echo "Actual chunk SHA-256 values:"
            sha256sum .ci/model-color-source.b64.*
            cat > /tmp/expected-chunks.sha256 <<'EOF'
          86420afc20b97dca9dbf6a9c17cf09d958c878bc1a3e7a914472769f35ed4cdc  .ci/model-color-source.b64.000
          b17ab07b7923d92d3d6eb2afcbd0623ae86b2d231ee67e43db662b0b8739e025  .ci/model-color-source.b64.001
          6adf4db1a5d6d72c3d03920f4d484d288bcb2b6ee984d9d5614db5d0da76b34d  .ci/model-color-source.b64.002
          06f974a700a02b1a26fff52303fd2543f866eb7f7c04fa1e908595d4c24b9411  .ci/model-color-source.b64.003
          d3819118f912b45d71b5fa09f21d2214bfeb70e4e98992e67de4c6bf269ff0fb  .ci/model-color-source.b64.004
          af3cba453030e30062342f13820afe11fca9d446700a196809a3d1b68eef697d  .ci/model-color-source.b64.005
          a94d9485bdb2dea5ffc3abf2ecd62426a15906562b5551f74700ae17a27cde50  .ci/model-color-source.b64.006
          6ac6063c014d54ba66f124abd880eee9fc824e5b68586ff321056ddd391e9cae  .ci/model-color-source.b64.007
          7bd15f0703f99659c696da2579b4ebc853684ce941e67e97c8a444af257786f9  .ci/model-color-source.b64.008
          9fa12e054203665b9f000f29b086f6b156d67f834e99bcc06f6faaa1168a267e  .ci/model-color-source.b64.009
          715ec7db385686f986fb6a8a02d70b1f40dfd4a68d42d87dab9d06a9ad44cb73  .ci/model-color-source.b64.010
          a59e8d6c3d4e1d4421088999b6a56f1db9a42b0844ff1da4925b0fa3ea152401  .ci/model-color-source.b64.011
          2fa1d801ac9582cf8cee15d89e65d833940cbd2ccaaf77093c8ecddb9eeb0034  .ci/model-color-source.b64.012
          EOF
            echo "Verification results:"
            sha256sum --check /tmp/expected-chunks.sha256
          } >> /tmp/restore.log 2>&1
          status=$?
          cat /tmp/restore.log
          exit "$status"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install Android 36 platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if ! sdkmanager "platform-tools" "platforms;android-36" > /tmp/sdk-install.log 2>&1; then
            tail -n 200 /tmp/sdk-install.log
            exit 1
          fi
          tail -n 30 /tmp/sdk-install.log

      - name: Restore and verify project source
        shell: bash
        run: |
          set -uo pipefail
          {
            mkdir -p /tmp/model-color
            find .ci -maxdepth 1 -name 'model-color-source.b64.*' -type f -print0 | sort -z | xargs -0 cat | base64 --decode > /tmp/model-color.tar.gz
            echo "Restored archive:"
            ls -l /tmp/model-color.tar.gz
            sha256sum /tmp/model-color.tar.gz
            echo "e9403ece9f39a89df235a0a74329d04e47a15d02bb5c5aa5b37605be86551ad0  /tmp/model-color.tar.gz" | sha256sum --check
            tar -xzf /tmp/model-color.tar.gz -C /tmp/model-color
            chmod +x /tmp/model-color/gradlew /tmp/model-color/scripts/*.sh
            /tmp/model-color/scripts/verify_project.sh
            sed -i 's/compileSdk = 37/compileSdk = 36/' /tmp/model-color/app/build.gradle.kts
            sed -i 's/targetSdk = 37/targetSdk = 36/' /tmp/model-color/app/build.gradle.kts
            grep -nE 'compileSdk|targetSdk' /tmp/model-color/app/build.gradle.kts
          } >> /tmp/restore.log 2>&1
          status=$?
          cat /tmp/restore.log
          exit "$status"

      - name: Run JVM unit tests
        working-directory: /tmp/model-color
        shell: bash
        run: |
          set -euo pipefail
          if ! ./gradlew testDebugUnitTest --stacktrace > /tmp/unit-test.log 2>&1; then
            tail -n 250 /tmp/unit-test.log
            exit 1
          fi
          tail -n 50 /tmp/unit-test.log

      - name: Run Android lint
        working-directory: /tmp/model-color
        shell: bash
        run: |
          set -euo pipefail
          if ! ./gradlew lintDebug --stacktrace > /tmp/lint.log 2>&1; then
            tail -n 250 /tmp/lint.log
            exit 1
          fi
          tail -n 50 /tmp/lint.log

      - name: Build debug APK
        working-directory: /tmp/model-color
        shell: bash
        run: |
          set -euo pipefail
          if ! ./gradlew assembleDebug --stacktrace > /tmp/assemble.log 2>&1; then
            tail -n 250 /tmp/assemble.log
            exit 1
          fi
          tail -n 50 /tmp/assemble.log

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp /tmp/model-color/app/build/outputs/apk/debug/app-debug.apk artifact/model-color-0.10.0-debug.apk
          sha256sum artifact/model-color-0.10.0-debug.apk | tee artifact/model-color-0.10.0-debug.apk.sha256
          unzip -t artifact/model-color-0.10.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-color-0.10.0-debug-apk
          path: |
            artifact/model-color-0.10.0-debug.apk
            artifact/model-color-0.10.0-debug.apk.sha256
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-color-build-diagnostics
          path: |
            /tmp/restore.log
            /tmp/unit-test.log
            /tmp/lint.log
            /tmp/assemble.log
          if-no-files-found: ignore
